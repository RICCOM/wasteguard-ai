services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: wasteguard-postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: wasteguard
      POSTGRES_USER: wasteguard
      POSTGRES_PASSWORD: wasteguard_password

    ports:
      - "15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: